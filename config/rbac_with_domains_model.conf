# Domain-aware RBAC — use this when roles are scoped per tenant.
#
# The default rbac_model.conf is DOMAIN-LESS: its `g = _, _` and its matcher
# ignore any domain, so a role granted "in tenant A" matches in every tenant.
# That is cross-tenant privilege escalation, so AuthorizationService now refuses
# the domain-scoped APIs unless a model like this one is loaded.
#
# Select it with:  AUTHZ_MODEL_PATH=/path/to/rbac_with_domains_model.conf
#
# NOTE: switching models changes the shape of the stored grouping rules — `g`
# gains a third column (the domain). Existing 2-column `g` rows must be migrated
# (assign each to its tenant) before this model will honour them.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

# Same wildcard support as the domain-less model, with the domain compared as
# well. "*" is accepted for the domain so a genuinely global grant is still
# expressible — but it must now be stated EXPLICITLY rather than being the
# accidental default.
[matchers]
m = g(r.sub, p.sub, r.dom) && (p.dom == "*" || r.dom == p.dom) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
